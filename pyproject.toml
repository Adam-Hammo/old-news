[project]
name = "old-news"
version = "1.0.0"
description = "Single-user feed reader: cross-source dedup, personalised ranking, permanent searchable archive. Postgres does everything."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "litestar[opentelemetry]>=2.24",
  "sqlalchemy[asyncio]>=2.1.0b3",
  "alembic>=1.14",
  "asyncpg>=0.31",
  # itsdangerous is what starlette's SessionMiddleware signs cookies with;
  # sqladmin needs it for auth but doesn't declare it.
  "sqladmin>=0.20",
  "itsdangerous>=2.2",
  "procrastinate>=3.9",
  # Pure-python: psycopg-binary publishes no free-threaded wheels. Needs libpq present.
  "psycopg>=3.2",
  "pydantic-settings>=2.7",
  "httpx2>=2.10",
  "feedparser>=6.0.14",
  # stdlib ElementTree expands entities, so an OPML file is a billion-laughs
  # vector. Confined to subscriptions/opml.py.
  "defusedxml>=0.7.1",
  # The stdlib's robotparser percent-encodes `=` in a rule pattern but not in the
  # query it matches against, so a rule like `Disallow: /*/*source=` can never fire.
  "protego>=0.6.2",
  "trafilatura>=2.2",
  # Renditions only — originals are never re-encoded. Declares free-thread safety, so
  # unlike older lxml it does not re-enable the GIL for the whole worker.
  "pillow>=12.3",
  "lxml>=7.0.0a3",
  "logfire[httpx,sqlalchemy,system-metrics]>=4.40",
  "uvicorn[standard]>=0.52.1",
  "alembic-utils>=0.8.8",
  "markdown-it-py>=4.2.0",
]

[project.scripts]
old-news = "old_news.__main__:main"

[dependency-groups]
dev = [
  "factory-boy>=3.3.3",
  "lxml-stubs>=0.5.1",
  "pre-commit>=4.0",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "pytest>=8.3",
  "ruff>=0.16",
  "testcontainers[postgres]>=4.15",
  "ty>=0.0.71",
  "vulture>=2.16",
]

[tool.uv]
# 2.0.x ships a cp314t wheel whose C extension doesn't declare free-thread
# safety, so CPython re-enables the GIL to load it and then segfaults — during
# traceback printing, which hides the real error. 2.1's declares it and works.
# Drop this once 2.1.0 final ships.
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/old_news"]

[tool.codespell]
ignore-words-list = "statics,selectin"

[tool.vulture]
# Dead code is debt waiting to happen, so this runs in CI. What it cannot see is
# code a framework reaches for by name: sqladmin's declarative attributes,
# procrastinate's task registry, pytest's fixture injection, columns read only
# through SQL. Those are named below rather than left to a --min-confidence knob
# that would also hide real findings.
paths = ["src", "tests"]
min_confidence = 60
sort_by_size = true
exclude = ["src/old_news/db/migrations/"]
ignore_decorators = [
  "@app.periodic",
  "@app.task",
  "@event.listens_for",
  "@get",
  "@pytest.fixture",
  "@task",
]
ignore_names = [
  # sqladmin configures views with class-level attributes.
  "can_*",
  "column_*",
  "form_*",
  "icon",
  # factory_boy reads a factory's options off a nested class of this name.
  "Meta",
  "abstract",
  # Frameworks call these by name, or hand them arguments we do not use.
  "authenticate",
  "do_GET",
  # Forced by BaseHTTPRequestHandler's signature: it can be passed by keyword, so
  # renaming it would break the override.
  "format",
  "log_message",
  "login",
  "logout",
  "metadata",
  "model_config",
  "parent_names",
  "slug",
  "timestamp",
  # SQLAlchemy calls a hybrid's expression half through its descriptor, never by name.
  "_*_expression",
  # Enum members reach Postgres through `db.base.one_of`, which iterates the class, and
  # through the seed SQL in a migration. Never named individually from Python.
  "OBSERVED",
  "SEED",
  # Alembic's env is outside the paths vulture scans, so what it calls looks unused.
  "migration_url",
  # Read through SQL, Admin or the ORM rather than from Python.
  "added_at",
  "created_at",
  "current_version",
  "first_seen_at",
  "last_success_at",
  "page_capture_id",
  "path_format",
  "read_at",
  "subscription",
  "supersedes",
  "versions",
  # pytest calls its hooks and injects its fixtures by name.
  "blanket_ban",
  "clean",
  "clean_client",
  "client",
  "database",
  "database_url",
  "feed_state",
  "fetcher",
  "http_server",
  "migrated",
  "no_jobs",
  "no_policies",
  "postgres",
  "pytest_*",
  "queue_app",
  "queue_schema",
  "server",
  "settings",
  "site",
  "targeted_ban",
]

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["infra"]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
  "A",     # a name that shadows a builtin
  "ASYNC", # async correctness
  "B",     # bugbear
  "C4",    # comprehensions
  "DTZ",   # a naive datetime against a TIMESTAMPTZ column
  "E",
  "ERA",   # commented-out code
  "F",
  "FURB",
  "G",     # an f-string log line breaks the alert that greps for its prefix
  "I",     # isort
  "ISC",
  "LOG",
  "PERF",
  "PIE",
  "PTH",   # pathlib
  "Q",
  "RET",
  "RSE",
  "RUF",
  "SIM",   # simplify
  "SLOT",
  "T20",   # a stray print in a service
  "TID",   # a library belongs to one package — see banned-api below
  "UP",    # pyupgrade
  "W",     # pycodestyle, pyflakes
]
ignore = [
  "B008", # function call in default arg — the Litestar idiom
]

# ARCHITECTURE.md: a third-party library gets imported by exactly one package, so
# replacing it stays a diff confined to that package. Prose until now; the
# per-file-ignores below are the list of owners.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx2".msg = "httpx2 belongs to fetch/"
"logfire".msg = "logfire belongs to observability/"
"feedparser".msg = "feedparser belongs to ingest/parser.py"
"defusedxml".msg = "defusedxml belongs to subscriptions/opml.py"
"trafilatura".msg = "trafilatura belongs to extract/"
"markdown_it".msg = "markdown-it-py belongs to kindle/render.py"
"PIL".msg = "pillow belongs to extract/"
"sqladmin".msg = "sqladmin belongs to api/admin.py"
"urllib.robotparser".msg = "urllib.robotparser belongs to robots/parse.py"

[tool.ruff.lint.per-file-ignores]
# sqladmin's ModelView is configured with plain class-level lists.
"src/old_news/api/admin.py" = ["RUF012", "TID251"]
# A CLI and a migration runner: stdout is the interface, not a stray debug line.
"src/old_news/__main__.py" = ["T201"]
"src/old_news/db/migrate.py" = ["T201"]
# Each library's one owning module.
"src/old_news/fetch/client.py" = ["TID251"]
"src/old_news/observability/telemetry.py" = ["TID251"]
"src/old_news/ingest/parser.py" = ["TID251"]
"src/old_news/subscriptions/opml.py" = ["TID251"]
"src/old_news/robots/parse.py" = ["TID251"]
"src/old_news/extract/*" = ["TID251"]
"src/old_news/kindle/render.py" = ["TID251"]
# Generated by alembic_utils: one long string literal per view definition. RUF001
# because a seed matching on a feed title has to spell it exactly, curly apostrophe
# and all.
"src/old_news/db/migrations/versions/*" = ["E501", "RUF001", "TID251"]
# Tests reach for a library directly to assert the boundary holds. `format` is forced by
# BaseHTTPRequestHandler's signature, which can pass it by keyword.
"tests/**" = ["TID251"]
"tests/conftest.py" = ["A002", "TID251"]

[tool.ruff.lint.isort]
known-first-party = ["old_news", "provider", "provider_oci"]
known-local-folder = ["factories"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is a first-party root for ty as well, so shared test modules import bare.
pythonpath = ["tests"]
asyncio_mode = "auto"
# asyncpg binds a pool to the loop that created it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# tests/unit needs nothing external; tests/integration needs Docker.
consider_namespace_packages = true
# Deprecations fail the build. There are none today; keep it that way.
filterwarnings = [
  "error",
  # lxml's free-threaded build asserts releasing a write lock it collects a tree under.
  # Upstream, raised in a destructor, and reproducible on stock trafilatura with a plain
  # string, so the reading is unaffected — but it fires on some real pages. See docs.
  "ignore:.*RWLock.unlock_write.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/old_news"]
branch = true

[tool.ty.environment]
python-version = "3.14"
root = ["./src", "./tests"]

[tool.ty.src]
# Pulumi lives in its own dependency group and its own module root. Generated revisions
# call operations alembic_utils registers at runtime, which no static checker can see.
exclude = ["infra", "src/old_news/db/migrations/versions"]
