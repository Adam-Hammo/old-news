[project]
name = "old-news"
version = "0.1.0"
description = "Single-user feed reader: cross-source dedup, personalised ranking, permanent searchable archive. Postgres does everything."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "litestar[opentelemetry]>=2.24",
  "sqlalchemy[asyncio]>=2.1.0b3",
  "alembic>=1.14",
  "asyncpg>=0.31",
  # itsdangerous is what starlette's SessionMiddleware signs cookies with;
  # sqladmin needs it for auth but doesn't declare it.
  "sqladmin>=0.20",
  "itsdangerous>=2.2",
  "procrastinate>=3.9",
  # Pure-python: psycopg-binary publishes no free-threaded wheels. Needs libpq present.
  "psycopg>=3.2",
  "pydantic-settings>=2.7",
  "httpx2>=2.10",
  "feedparser>=6.0.14",
  # stdlib ElementTree expands entities, so an OPML file is a billion-laughs
  # vector. Confined to subscriptions/opml.py.
  "defusedxml>=0.7.1",
  "trafilatura>=2.2",
  "logfire[sqlalchemy,system-metrics]>=4.40",
  "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]

[project.scripts]
old-news = "old_news.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "testcontainers[postgres]>=4.15",
  "ruff>=0.16",
  "ty>=0.0.71",
  "pre-commit>=4.0",
]

[tool.uv]
# 2.0.x ships a cp314t wheel whose C extension doesn't declare free-thread
# safety, so CPython re-enables the GIL to load it and then segfaults — during
# traceback printing, which hides the real error. 2.1's declares it and works.
# Drop this once 2.1.0 final ships.
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/old_news"]

[tool.codespell]
# "statics" is sqladmin's static-assets URL segment, not a misspelling of
# "statistics".
ignore-words-list = "statics"

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["infra"]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",     # pycodestyle, pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplify
  "ASYNC", # async correctness
  "RUF",
]
ignore = [
  "B008", # function call in default arg — Litestar/Piccolo idiom
]

[tool.ruff.lint.per-file-ignores]
# sqladmin's ModelView is configured with plain class-level lists.
"src/old_news/api/admin.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["old_news", "provider", "provider_oci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# asyncpg binds a pool to the loop that created it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# tests/unit needs nothing external; tests/integration needs Docker.
consider_namespace_packages = true
# Deprecations fail the build. There are none today; keep it that way.
filterwarnings = [
  "error",
  # Piccolo pings the server when the engine is constructed, which happens on
  # import. Unit tests have no database and don't need one.
  "ignore:.*Unable to fetch server version.*:Warning",
]

[tool.coverage.run]
source = ["src/old_news"]
branch = true

[tool.ty.environment]
python-version = "3.14"
root = ["./src", "./tests"]

[tool.ty.src]
# Pulumi lives in its own dependency group and its own module root.
exclude = ["infra"]
