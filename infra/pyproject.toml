# A project of its own, not a dependency group of the application.
#
# The bridged SDKs under sdks/ are path dependencies, and uv resolves those whether
# or not their group is selected. Held in the root project they put `infra/` on the
# critical path of the application's Docker build, which does not ship it — the image
# build fails outright. Here, nothing about the app knows this directory exists.
[project]
name = "old-news-infra"
version = "0"
requires-python = ">=3.14"
dependencies = [
  "pulumi>=3.256",
  "pulumi-oci>=4.20",
  "pulumi-random>=4.21",
  "pulumi-tailscale>=0.29",
  "pulumi-b2",
  "pulumi-logfire",
]

[dependency-groups]
# Ansible only, so a deploy doesn't download Pulumi's provider SDKs.
deploy = ["ansible-core>=2.21"]

[tool.uv]
package = false

# Generated by `pulumi package add` — see Pulumi.yaml.
[tool.uv.sources]
pulumi-b2 = { path = "sdks/b2" }
pulumi-logfire = { path = "sdks/logfire" }
