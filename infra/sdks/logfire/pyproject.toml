[project]
name = "pulumi_logfire"
description = "A Pulumi provider dynamically bridged from logfire."
dependencies = [
  "parver>=0.2.1",
  "pulumi>=3.247.0,<4.0.0",
  "semver>=2.8.1",
  "typing-extensions>=4.11,<5; python_version < \"3.11\"",
]
readme = "README.md"
requires-python = ">=3.9"
version = "0.1.15"
[project.urls]
Repository = "https://github.com/pydantic/terraform-provider-logfire"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool]
[tool.setuptools]
[tool.setuptools.package-data]
pulumi_logfire = ["py.typed", "pulumi-plugin.json"]
