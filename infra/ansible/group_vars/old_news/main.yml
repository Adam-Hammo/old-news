---
app_dir: /opt/old-news

# Loopback only: Tailscale Serve fronts the API on the tailnet and terminates TLS.
app_bind: 127.0.0.1
api_host_port: 8000
# Its own mount, and the app is told the same value so the two cannot drift.
admin_path: /admin
web_host_port: 3000

# Public packages, so the box holds no registry credential.
registry: ghcr.io/adam-hammo

tailscale_tag: "tag:server"
tailscale_hostname: rss-01

heartbeat_interval: 5min

keepbusy_enabled: true
keepbusy_workers: 1
keepbusy_load: 50
keepbusy_duration: 2h
keepbusy_schedule: "17:00"

telemetry_enabled: true

# psutil inside a container reads the host's /proc but reports under the container
# id, so the api and the worker show up in Logfire as two hosts. The collector's
# hostmetrics is what answers the keepbusy question now.
telemetry_system_metrics: false

# One span per query: the biggest single lever on telemetry volume, which is why it is
# off. Turn it on while chasing a slow query and turn it off again.
telemetry_instrument_database: false

# What share of the traces that went neither wrong nor slow is kept. The box's work is
# a picture fetched, encoded and filed, several thousand times a day, and none of those
# traces is ever read. Counters are metrics and are never sampled.
telemetry_background_sample_rate: 0.2

otel_endpoint: https://logfire-eu.pydantic.dev

# The collector mounts the docker socket, which is root on the host. false drops
# the container and the mount together.
otel_collector_enabled: true
compose_profiles: "{{ '--profile telemetry' if otel_collector_enabled else '' }}"
