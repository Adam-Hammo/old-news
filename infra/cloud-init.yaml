#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - restic
  - python3

runcmd:
  # Tailscale first — it is how you reach the box at all.
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --auth-key=${TAILSCALE_AUTH_KEY} --ssh --hostname=old-news

  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu noble stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - usermod -aG docker ubuntu

  # OCI images ship a restrictive iptables INPUT chain on top of the VCN security
  # list. Tailscale carries all real traffic, so drop the stale rules.
  - iptables -F INPUT
  - netfilter-persistent save || true
