# gitleaks' own rules, plus one allowance.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = [
  "access",
  "api",
  "auth",
  "client",
  "key",
  "passwd",
  "password",
  "secret",
  "token",
]

[rules.allowlist]
description = """
  Checked-in publisher pages are kept byte-for-byte as served, because their whole value is
  being exactly what a site sent us on a particular day — trimming them would change what
  they prove. Any keys inside are the publisher's own public client-side ones, visible in
  any browser's view of the same page, and none of them are ours.
  """
paths = ['''^tests/pages/.*\.html$''']
