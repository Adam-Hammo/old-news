version: 2
# infra/ is absent on purpose: Dependabot follows its path sources into the generated
# SDKs, and there is no key to exclude a path. Use `just infra-update`.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]
    ignore:
      # Until svelte-check's typescript peer range admits 7, which blocks the whole group.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: ["/", "/docker", "/web"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
