version: 2
# infra/ is absent on purpose: Dependabot follows its path sources into the generated
# SDKs, and there is no key to exclude a path. Use `just infra-update`.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/docker"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
