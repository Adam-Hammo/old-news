name: ci

on:
  push:
    branches: [main]
  pull_request:

# PRs supersede; main queues, so a deploy is never cancelled mid-playbook.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every recipe here is the one you run locally, so CI can't drift from `just`.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10
        with:
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          # Without a fallback, changing one hook rebuilds every environment.
          restore-keys: pre-commit-
      - run: uv sync --all-extras --locked
      # prettier, eslint and svelte-check run as hooks now, so the client's dependencies
      # are part of linting.
      - run: npm --prefix web ci
      - run: just lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10
        with:
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --all-extras --locked
      # Docker is preinstalled on the runner; the integration fixtures build the
      # Postgres image themselves.
      - run: just cov

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: npm --prefix web ci
      # A real browser for the component tests, for the same reason the Python suite
      # does not mock Postgres.
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: just web-test
      # The contract is generated from the API, so a build is also the check that the
      # two languages still agree.
      - run: just web-build

  # arm64 under QEMU is slow, so it only runs where it earns its keep: on main
  # (publishing what the box will pull) or on a PR labelled `docker`.
  image:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'docker')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: old-news
            context: .
            file: ./Dockerfile
          - name: old-news-postgres
            context: ./docker
            file: ./docker/postgres.Dockerfile
          - name: old-news-backup
            context: ./docker
            file: ./docker/backup.Dockerfile
          - name: old-news-web
            context: ./web
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      # GHCR rejects mixed-case names and the owner is `Adam-Hammo`.
      - name: Lowercase the registry namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Provider credentials stay in stack config; the token is what decrypts them.
  infra:
    # Fork pull requests get no secrets, and a preview cannot run without them.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      # Keep in step with deploy.yml.
      PULUMI_VERSION: 3.257.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10
        with:
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ hashFiles('infra/uv.lock', 'infra/Pulumi.yaml') }}
          restore-keys: pulumi-plugins-
      - name: Install the Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >>"$GITHUB_PATH"

      - name: Preview
        run: |
          set -o pipefail
          just infra-preview 2>&1 | tee preview.txt

      - name: Report the plan
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          sed -E -e '/^(Downloading|Installing) plugin /d' -e '/^@ /d' \
            -e '/^Logging in using/d' -e '/^Duration:/d' preview.txt | cat -s >clean.txt

          # The preview URL is fresh every run, so the digest ignores it and a push
          # that changes no plan leaves the comment untouched.
          digest=$(sed -E '/previews\/[0-9a-f-]+/d' clean.txt | sha256sum | cut -d' ' -f1)

          {
            echo "<!-- plan:$digest -->"
            echo '### Pulumi preview'
            echo '```'
            tail -c 60000 clean.txt
            echo '```'
          } >report.md
          cat report.md >>"$GITHUB_STEP_SUMMARY"

          [ -n "$PR" ] || exit 0
          if gh pr view "$PR" --json comments --jq '.comments[].body' \
            | grep -qF "plan:$digest"; then
            echo "plan unchanged; leaving the comment alone"
            exit 0
          fi
          gh pr comment "$PR" --body-file report.md --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file report.md

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: just infra-apply

  # Called from here rather than triggered on `workflow_run`, so `needs` guarantees
  # the images exist.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # infra before deploy: the playbook's variables are this stack's outputs.
    needs: [lint, test, web, image, infra]
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
