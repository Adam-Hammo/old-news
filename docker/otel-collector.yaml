# Feeds Logfire's Hosts and Docker views, and queue-and-host.json.
# 60s everywhere: the collection interval is the only real lever on ingest volume.
#
# The `utilization` metrics are all opt-in — by default the scrapers emit only the
# raw `time` and `usage` counters, and every percentage panel comes up blank.

receivers:
  hostmetrics:
    # Without root_path the scrapers report the container's limits, not the host's.
    root_path: /hostfs
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      paging:
      network:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        exclude_mount_points:
          # One series per squashfs image, and snapd churns them on every refresh.
          # Mount points come back host-relative — root_path is not a prefix here.
          mount_points: ["/snap/.*"]
          match_type: regexp

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 60s
    metrics:
      container.restarts:
        enabled: true
      container.uptime:
        enabled: true
      container.memory.usage.max:
        enabled: true
      container.cpu.throttling_data.throttled_time:
        enabled: true
      container.cpu.logical.count:
        enabled: true
    container_labels_to_metric_labels:
      com.docker.compose.project: com.docker.compose.project
      com.docker.compose.service: com.docker.compose.service

  postgresql:
    endpoint: db:5432
    username: old_news
    password: ${env:POSTGRES_PASSWORD}
    databases: [old_news]
    collection_interval: 60s
    tls:
      insecure: true
    metrics:
      postgresql.deadlocks:
        enabled: true
      postgresql.database.locks:
        enabled: true
      postgresql.sequential_scans:
        enabled: true
      postgresql.temp_files:
        enabled: true
      postgresql.temp.io:
        enabled: true
      postgresql.tup_inserted:
        enabled: true
      postgresql.tup_updated:
        enabled: true
      postgresql.tup_deleted:
        enabled: true
      postgresql.tup_fetched:
        enabled: true
      postgresql.tup_returned:
        enabled: true

processors:
  batch:
    timeout: 10s

  # One resource block per source: they differ only in service.name, and leaving
  # that unset is what renders every legend as "unknown_service". host.name is on
  # all three — it is one box, and Logfire's Docker view counts hosts by it.
  # resourcedetection is no help: the collector's own hostname is its container id.
  resource/host:
    attributes:
      - key: deployment.environment.name
        value: production
        action: upsert
      - key: host.name
        value: ${env:OTEL_HOST_NAME}
        action: upsert
      - key: service.name
        value: old-news-host
        action: upsert

  resource/docker:
    attributes:
      - key: deployment.environment.name
        value: production
        action: upsert
      - key: host.name
        value: ${env:OTEL_HOST_NAME}
        action: upsert
      - key: service.name
        value: old-news-docker
        action: upsert

  resource/postgres:
    attributes:
      - key: deployment.environment.name
        value: production
        action: upsert
      - key: host.name
        value: ${env:OTEL_HOST_NAME}
        action: upsert
      - key: service.name
        value: old-news-postgres
        action: upsert

  # docker_stats reports this one 0-100 while declaring unit "1", which OpenTelemetry
  # defines as a 0-1 ratio. Anything reading the unit multiplies by 100 and shows
  # 1492% for a container using 149 MiB of a gigabyte. Scaling here makes the metric
  # mean what it says it means.
  metricstransform/docker:
    transforms:
      - include: container.memory.percent
        match_type: strict
        action: update
        operations:
          - action: experimental_scale_value
            experimental_scale: 0.01

exporters:
  otlphttp:
    endpoint: ${env:OTEL_LOGFIRE_ENDPOINT}
    headers:
      Authorization: ${env:LOGFIRE_TOKEN}

service:
  pipelines:
    # One per source, because each carries a different service.name.
    metrics/host:
      receivers: [hostmetrics]
      processors: [resource/host, batch]
      exporters: [otlphttp]

    metrics/docker:
      receivers: [docker_stats]
      processors: [resource/docker, metricstransform/docker, batch]
      exporters: [otlphttp]

    metrics/postgres:
      receivers: [postgresql]
      processors: [resource/postgres, batch]
      exporters: [otlphttp]
  telemetry:
    logs:
      level: warn
