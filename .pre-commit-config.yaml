# Every hook is pinned. `just lint` runs exactly what CI runs.
default_install_hook_types: [pre-commit, commit-msg]
# Generated code
exclude: ^(src/old_news/db/migrations/|infra/sdks/|tests/pages/|web/src/lib/api/schema\.d\.ts)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]
        # web/ has its own prettier below: this one cannot load the Svelte plugin its
        # config asks for, and would fail on the json files there for that alone.
        exclude: ^(infra/ansible/.*\.j2|web/)

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # A lockfile is integrity hashes and package names, not prose.
        exclude: ^web/package-lock\.json$
        additional_dependencies: [tomli]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: just-fmt
        name: just --fmt
        entry: just --unstable --fmt --check
        language: system
        files: ^justfile$
        pass_filenames: false

      # web/ is a second toolchain, so it needs its own four: format, lint, types and
      # a vulnerability check. These mirror ruff-format, ruff, ty and uv-audit above.
      # All of them are `npm --prefix`, which runs with web/ as the working directory.
      - id: prettier-web
        name: prettier (web)
        entry: npm --prefix web exec -- prettier --write
        language: system
        files: ^web/(src|static)/.*\.(svelte|ts|css|html|json)$|^web/[a-z]+\.config\.(ts|js)$

      - id: eslint-web
        name: eslint (web)
        entry: npm --prefix web run --silent lint
        language: system
        files: ^web/(src/|eslint\.config\.js|package\.json)
        pass_filenames: false

      - id: svelte-check
        name: svelte-check (web)
        entry: npm --prefix web run --silent check
        language: system
        files: ^web/(src/|package\.json|tsconfig\.json|vite\.config\.ts)
        pass_filenames: false

      - id: npm-audit
        name: npm audit (web)
        entry: npm --prefix web audit --audit-level=high
        language: system
        files: ^web/package-lock\.json$
        pass_filenames: false

      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      # Paths, ignores and confidence live in pyproject.toml.
      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture
        language: system
        types: [python]
        pass_filenames: false

      - id: uv-audit
        name: uv audit
        entry: uv audit --preview-features audit-command
        language: system
        files: ^uv\.lock$
        pass_filenames: false

      # infra/ is a second uv project, which the uv-lock hook above does not see.
      - id: uv-lock-infra
        name: uv lock --check (infra)
        entry: uv lock --project infra --check
        language: system
        files: ^infra/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
