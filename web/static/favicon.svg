<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<style>
		:root {
			--paper: #f7f4ee;
			--ink: #17150f;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--paper: #1c1a17;
				--ink: #ece6da;
			}
		}
	</style>
	<rect width="64" height="64" rx="6" fill="var(--paper)" />
	<g fill="var(--ink)">
		<rect x="12" y="14" width="40" height="5" />
		<rect x="12" y="25" width="18" height="3" />
		<rect x="12" y="32" width="18" height="3" />
		<rect x="12" y="39" width="18" height="3" />
		<rect x="34" y="25" width="18" height="17" />
		<rect x="12" y="48" width="40" height="3" />
	</g>
</svg>
